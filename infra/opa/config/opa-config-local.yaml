# OPA Configuration for Local Development
# Used by: ./app.sh opa
# Standard OPA without Enterprise plugins

services:
  s3:
    url: https://s3.us-east-1.amazonaws.com
    credentials:
      s3_signing:
        environment_credentials: {}

decision_logs:
  console: true
  reporting:
    min_delay_seconds: 5
    max_delay_seconds: 10

status:
  console: true
  prometheus: true

server:
  encoding:
    gzip:
      min_length: 1024

bundles:
  ea-financial:
    resource: ea-financial-demo-policy/policies/ea-financial/bundle.tar.gz
    service: s3
    polling:
      min_delay_seconds: 10
      max_delay_seconds: 20

# Configure metrics
metrics:
  prometheus:
    http_request_duration_seconds:
      buckets:
        - 0.005
        - 0.01
        - 0.025
        - 0.05
        - 0.1
        - 0.25
        - 0.5
        - 1
        - 2.5
        - 5
        - 10

# Default decision
default_decision: "/v1/data/ea_financial/authz/allow"

# Default authorization query
default_authorization_decision: "/v1/data/ea_financial/authz/allow"
